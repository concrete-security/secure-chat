name: Certificate Manager

on:
  push:
    branches:
      - main
    paths:
      - "cvm/cert-manager/**"
  pull_request:
    paths:
      - "cvm/cert-manager/**"
  # for manual trigger from GitHub UI
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: concrete-security/cert-manager

jobs:
  ruff-lint-format:
    runs-on: ubuntu-latest
    name: Ruff check
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7

      - name: Install dependencies
        working-directory: ./cvm/cert-manager
        run: |
          uv sync --dev

      - name: Run Ruff linter
        working-directory: ./cvm/cert-manager
        run: |
          uv run ruff check .

      - name: Run Ruff formatter check
        working-directory: ./cvm/cert-manager
        run: |
          uv run ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    name: Pytest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7

      - name: Install dependencies
        working-directory: ./cvm/cert-manager
        run: |
          uv sync --group test

      - name: Run Pytest
        working-directory: ./cvm/cert-manager
        run: |
          uv run pytest -v

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [ruff-lint-format, pytest]
    permissions:
      contents: read
      packages: write
    outputs:
      image-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Log in to Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tags and Labels
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ./cvm/cert-manager
          file: ./cvm/cert-manager/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact summary
        run: |
          echo "### Docker Image Built Successfully! 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  update-compose:
    name: Update docker-compose.yml digest
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Update image digest in docker-compose.yml
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}"
          NEW_DIGEST="${{ needs.build-and-push.outputs.image-digest }}"
          sed -i "s|${IMAGE}@sha256:[a-f0-9]*|${IMAGE}@${NEW_DIGEST}|g" cvm/docker-compose.yml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-update/cert-manager-digest
          title: "chore(cvm): update cert-manager image digest"
          body: |
            Auto-generated PR to update `cert-manager` image digest in `cvm/docker-compose.yml`.

            **New digest:** `${{ needs.build-and-push.outputs.image-digest }}`
            **Triggered by:** ${{ github.sha }}
          commit-message: "chore(cvm): update cert-manager image digest"
          delete-branch: true

  provenance:
    needs: [build-and-push]
    permissions:
      actions: read # for detecting the Github Actions environment.
      id-token: write # for creating OIDC tokens for signing.
      packages: write # for uploading attestations.
    # See https://github.com/slsa-framework/slsa-github-generator/issues/358
    if: ${{ github.event_name != 'pull_request' }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build-and-push.outputs.image-name }}
      digest: ${{ needs.build-and-push.outputs.image-digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
